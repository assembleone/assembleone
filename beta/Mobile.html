<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7f1d1d">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>FittersIQ Mobile BETA</title>
<style>html,body{margin:0;min-height:100%;background:#7f1d1d;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}#loader{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}</style>
<script>
// BETA TEST COPY of FittersIQ Mobile (data lifecycle branch). Kept apart from the normal app
// on the same site: every browser storage name used here gets its own "fiqbeta:" prefix, so
// this copy has its own saved jobs, its own photo store and its own sign-in, and can never
// read, change or clear the normal Mobile app's data on this phone.
(function(){
  var P='fiqbeta:';
  try{
    var ls=window.localStorage,proto=Storage.prototype;
    var getItem=proto.getItem,setItem=proto.setItem,removeItem=proto.removeItem,key=proto.key;
    proto.getItem=function(k){return this===ls?getItem.call(this,P+k):getItem.call(this,k)};
    proto.setItem=function(k,v){return this===ls?setItem.call(this,P+k,v):setItem.call(this,k,v)};
    proto.removeItem=function(k){return this===ls?removeItem.call(this,P+k):removeItem.call(this,k)};
    // Clearing only ever removes this copy's own keys.
    proto.clear=(function(clear){return function(){if(this!==ls)return clear.call(this);var mine=[];for(var i=0;i<this.length;i++){var k=key.call(this,i);if(k&&k.indexOf(P)===0)mine.push(k)}mine.forEach(function(k){removeItem.call(ls,k)})}})(proto.clear);
  }catch(e){}
  try{
    var factory=IDBFactory.prototype,open=factory.open,del=factory.deleteDatabase;
    factory.open=function(name,version){return version===undefined?open.call(this,P+name):open.call(this,P+name,version)};
    factory.deleteDatabase=function(name){return del.call(this,P+name)};
  }catch(e){}
  try{
    var BC=window.BroadcastChannel;
    if(BC){var Beta=function(name){return new BC(P+name)};Beta.prototype=BC.prototype;window.BroadcastChannel=Beta}
  }catch(e){}
})();
</script>
</head>
<body>
<div id="loader">Opening FittersIQ Mobile BETA…</div>
<script>
(async function(){
  try{
    var stamp=Date.now();
    var here=location.href.split('#')[0].split('?')[0].replace(/[^\/]*$/,'');
    var html=await fetch(here+'Mobile-Core.html?beta=1&ts='+stamp,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Could not load Mobile core');return r.text()});
    var lower=html.toLowerCase();
    if(html.length<100000||lower.indexOf('<body')===-1||lower.lastIndexOf('</body>')===-1||lower.lastIndexOf('</html>')===-1||html.indexOf('assembleone_mobile_v2')===-1){
      throw new Error('Mobile core failed safety validation');
    }
    // Shared, unchanged files (icons, translations, help, sync helper) come from the normal
    // site folder. The home-screen manifest is left out so the beta cannot be installed over
    // the normal app.
    html=html.replace('<link rel="manifest" href="manifest-mobile.json?v=4">','');
    html=html.replace(/<head([^>]*)>/i,function(m){return m+'<base href="'+here+'../">'});
    var patch='<script src="'+here+'mobile-build83-cleanup.js?beta=1&ts='+stamp+'"><\/script>';
    var scanFix='<script src="'+here+'mobile-build86-scan-fix.js?beta=1&ts='+stamp+'"><\/script>';
    var jobsCleanup='<script src="'+here+'mobile-build88-jobs-cleanup.js?beta=1&ts='+stamp+'"><\/script>';
    var cleanup='<style id="fiq-build89-cleanup">.panel-check-complete-banner{display:none!important}<\/style>';
    var banner='<div id="fiqBetaBanner" style="position:fixed;left:0;right:0;top:0;z-index:2147483647;background:#b91c1c;color:#fff;font:800 11px/1.6 Inter,Arial,sans-serif;text-align:center;letter-spacing:.04em;pointer-events:none;padding-top:env(safe-area-inset-top)">BETA TEST COPY - NOT YOUR NORMAL FITTERSIQ APP<\/div>';
    var retitle='<script>document.title="BETA "+String(document.title).replace(/^BETA /,"")<\/script>';
    var inject=cleanup+patch+scanFix+jobsCleanup+banner+retitle;
    var bodyClose=lower.lastIndexOf('</body>');
    html=html.slice(0,bodyClose)+inject+html.slice(bodyClose);
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);
    var el=document.getElementById('loader');
    if(el)el.innerHTML='FittersIQ Mobile BETA could not load.<br>Please refresh the page.';
  }
})();
</script>
</body>
</html>
