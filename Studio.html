<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FittersIQ Studio</title>
</head>
<body style="font-family:Segoe UI,Arial,sans-serif;background:#0B2545;color:white;display:grid;place-items:center;min-height:100vh;margin:0">
  <div id="studioLoader" style="text-align:center">Opening FittersIQ Studio…</div>
  <script>
  (async function(){
    try{
      var stamp=Date.now();
      var url='Studio-Recovery.html?desktop=build86-customer-search&ts='+stamp;
      var html=await fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Could not load Studio core');return r.text()});
      var lower=html.toLowerCase();
      if(html.length<100000||lower.indexOf('<body')===-1||lower.lastIndexOf('</body>')===-1||lower.lastIndexOf('</html>')===-1||html.indexOf('FittersIQ Studio')===-1){
        throw new Error('Studio core failed safety validation');
      }
      var patch='<script src="studio-patch.js?build=86&ts='+stamp+'"><\/script>';
      var snapshot='<script src="studio-dispatch-snapshot.js?build=86&ts='+stamp+'"><\/script>';
      var hardening='<script src="studio-sync-hardening.js?build=90&ts='+stamp+'"><\/script>';
      // Automatic cloud backup (step 6), area "production" of the company. It does nothing until support
      // turns the company switch on AND this computer's switch is turned on.
      var cm=function(n,mod){return '<script'+(mod?' type="module"':'')+' src="cloud-master/'+n+'?build=91&ts='+stamp+'"><\/script>'};
      var cloud='<script>window.FIQ_CLOUD_ENV="production"<\/script>'+cm('fiq-cloud-copy.js')+cm('backup-schedule.js')+cm('fiq-cloud-restore.js')+cm('studio-cloud-copy.js',true);
      var bodyClose=html.toLowerCase().lastIndexOf('</body>');
      // FittersIQ Estimator (spec v1.1): internal costing only, its own data (state.estimates, state.priceList).
      var estimator='<script src="estimator-core.js?build=92&ts='+stamp+'"><\/script><script src="estimator-studio.js?build=92&ts='+stamp+'"><\/script>';
      // FittersIQ Academy in Studio: the Academy button under Cutting List and its page (its own file; it changes no Studio data).
      var academy='<script src="academy-studio.js?build=93&ts='+stamp+'"><\/script>';
      // Compact header for narrow windows (Mads, 12 Nov 2026): one row; How It Works, account and language fold out under a menu button. Its own file; the core is untouched.
      var header='<script src="studio-header-compact.js?build=94&ts='+stamp+'"><\/script>';
      // Estimate, or straight to the job (Mads, 14 Nov 2026): asked once when a new, empty design is opened. Its own file; the Estimate rules are untouched.
      var stageChoice='<script src="studio-estimate-choice.js?build=95&ts='+stamp+'"><\/script>';
      // Panel Check size check (Mads, 17 Nov 2026): marks sizes that look like typing mistakes (130 instead of 1300) and gives ordinary unchecked panels a calm look. Its own file; the core is untouched.
      var sizeCheck='<script src="panel-size-check.js?build=96&ts='+stamp+'"><\/script>';
      html=html.slice(0,bodyClose)+patch+hardening+snapshot+cloud+estimator+academy+header+stageChoice+sizeCheck+html.slice(bodyClose);
      document.open();document.write(html);document.close();
    }catch(e){
      console.error(e);
      var loader=document.getElementById('studioLoader');
      if(loader)loader.innerHTML='FittersIQ Studio could not load safely.<br>Please refresh the page.';
    }
  })();
  </script>
</body>
</html>
