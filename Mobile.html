<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FittersIQ Mobile</title>
<style>html,body{margin:0;min-height:100%;background:#0B2545;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}#loader{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}</style>
</head>
<body>
<div id="loader">Opening FittersIQ Mobile…</div>
<script>
(async function(){
  try{
    var stamp=Date.now();
    var html=await fetch('Mobile-Core.html?build=89-safe&ts='+stamp,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Could not load Mobile core');return r.text()});
    var lower=html.toLowerCase();
    if(html.length<100000||lower.indexOf('<body')===-1||lower.lastIndexOf('</body>')===-1||lower.lastIndexOf('</html>')===-1||html.indexOf('assembleone_mobile_v2')===-1){
      throw new Error('Mobile core failed safety validation');
    }
    var patch='<script src="mobile-build83-cleanup.js?build=89&ts='+stamp+'"><\/script>';
    var scanFix='<script src="mobile-build86-scan-fix.js?build=89&ts='+stamp+'"><\/script>';
    var jobsCleanup='<script src="mobile-build88-jobs-cleanup.js?build=89&ts='+stamp+'"><\/script>';
    var cleanup='<style id="fiq-build89-cleanup">.panel-check-complete-banner{display:none!important}<\/style>';
    var inject=cleanup+patch+scanFix+jobsCleanup;
    var bodyClose=lower.lastIndexOf('</body>');
    html=html.slice(0,bodyClose)+inject+html.slice(bodyClose);
    html=html.replace('BUILD 2026-08-30-REBUILD-1','');
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);
    var el=document.getElementById('loader');
    if(el)el.innerHTML='FittersIQ Mobile could not load safely.<br>Please refresh the page.';
  }
})();
</script>
</body>
</html>
