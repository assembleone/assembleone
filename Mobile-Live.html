<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<title>FittersIQ Mobile</title>
<style>html,body{margin:0;min-height:100%;background:#0B2545;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}#loader{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}</style>
</head>
<body>
<div id="loader">Opening FittersIQ Mobile…</div>
<script>
(async function(){
  try{
    var url='Mobile.html?base=live83&ts='+Date.now();
    var html=await fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Could not load Mobile');return r.text()});
    var patch='<script src="mobile-build83-cleanup.js?build=83&ts='+Date.now()+'"><\/script>';
    html=html.replace(/<\/body\s*>/i,patch+'</body>');
    html=html.replace('BUILD 2026-08-30-REBUILD-1','BUILD 83 MOBILE CLEANUP');
    document.open();document.write(html);document.close();
  }catch(e){console.error(e);document.getElementById('loader').textContent='Could not open FittersIQ Mobile. Please refresh.'}
})();
</script>
</body>
</html>
