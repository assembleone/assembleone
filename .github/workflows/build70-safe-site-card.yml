name: Build 70 safe site measurement card

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Build 70 run')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded Studio patch
        run: python3 .github/scripts/build70_patch.py
      - name: Check Studio only helper syntax
        run: node --check fittersiq-studio-ui.js
      - name: Commit Build 70
        run: |
          rm -f .github/workflows/build70-safe-site-card.yml
          git config user.name "FittersIQ Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Studio.html .github/workflows/build70-safe-site-card.yml
          git commit -m "Build 70: safe Site Measurement card layout"
          git push origin main
