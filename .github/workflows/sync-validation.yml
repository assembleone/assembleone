name: Sync repair validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sync:
    if: github.head_ref == 'fix/resume-two-way-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real transfer and merge functions with isolated data
        run: node tests/sync-roundtrip.cjs
      - name: Install isolated browser test dependencies
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test persistent outbox in Chromium
        run: node tests/sync-outbox.cjs
