name: Mobile workflow regression checks
on:
  push:
    branches: [fix/mobile-workflow-review]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node qa/site-job-switching.cjs --browser
      - run: node tests/panel-check.cjs
      - run: node tests/sync-roundtrip.cjs
