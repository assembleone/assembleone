name: Floor picker check
on:
  push:
    branches: [fix/floor-number-picker]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node qa/floor-preview.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: floor-picker-preview
          path: floor-previews/
