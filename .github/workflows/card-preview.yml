name: Job card visual check
on:
  push:
    branches: [fix/job-card-layout]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node qa/job-card-preview.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: job-card-previews
          path: card-previews/
