name: Build 73 Drawing customer room

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Build 73 rerun')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/scripts/build73_patch.py
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Studio-Recovery.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              attrs=m.group(1) or ''
              body=m.group(2) or ''
              if 'type="module"' in attrs or "type='module'" in attrs:
                  continue
              if body.strip():
                  blocks.append(body)
          Path('/tmp/studio73-inline.js').write_text('\n;\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/studio73-inline.js
      - name: Commit
        run: |
          rm -f .github/workflows/build73-drawing-customer-room.yml .github/scripts/build73_patch.py
          git config user.name "FittersIQ Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Studio-Recovery.html .github/workflows/build73-drawing-customer-room.yml .github/scripts/build73_patch.py
          git commit -m "Build 73: link Drawing to customer and room"
          git push origin main
