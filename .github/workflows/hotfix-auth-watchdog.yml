name: Hotfix Studio auth watchdog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Auth watchdog bootstrap')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add one-shot auth recovery watchdog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Studio.html')
          s=p.read_text(encoding='utf-8')
          marker='''<script src="fittersiq-help.js?v=20260911-clean1"></script>\n<script src="fittersiq-studio-ui.js?v=20260911-build70"></script>'''
          replacement='''<script src="fittersiq-help.js?v=20260911-clean2"></script>\n<script src="fittersiq-studio-ui.js?v=20260911-build70b"></script>\n<script>\n(function(){\n  var key='fiq-auth-recovery-once-v1';\n  setTimeout(function(){\n    var checking=document.getElementById('fiqStateChecking');\n    var gate=document.getElementById('fiqAuthGate');\n    if(!gate||!checking||checking.hidden) return;\n    try{\n      if(sessionStorage.getItem(key)) return;\n      sessionStorage.setItem(key,'1');\n    }catch(e){}\n    var u=new URL(location.href);\n    u.searchParams.set('fiqfresh','20260911-authfix1');\n    location.replace(u.toString());\n  },7000);\n})();\n</script>'''
          if s.count(marker)!=1:
              raise SystemExit(f'Expected one Studio helper marker, found {s.count(marker)}')
          s=s.replace(marker,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/hotfix-auth-watchdog.yml
          git config user.name "FittersIQ Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Studio.html .github/workflows/hotfix-auth-watchdog.yml
          git commit -m "Hotfix: recover stuck Studio account check"
          git push origin main
