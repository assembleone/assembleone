name: Build 77 compact Drawing toolbar

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Build 77 run')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded patch
        run: python3 .github/scripts/build77_toolbar_layout.py
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Studio-Recovery.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              attrs=m.group(1) or ''
              body=m.group(2) or ''
              if 'type="module"' in attrs or "type='module'" in attrs: continue
              if body.strip(): blocks.append(body)
          Path('/tmp/studio77-inline.js').write_text('\n;\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/studio77-inline.js
      - name: Commit
        run: |
          rm -f .github/workflows/build77-toolbar-layout.yml .github/scripts/build77_toolbar_layout.py
          git config user.name "FittersIQ Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Studio-Recovery.html .github/workflows/build77-toolbar-layout.yml .github/scripts/build77_toolbar_layout.py
          git commit -m "Build 77: compact Drawing toolbar"
          git push origin main
