name: Build 71 separate site measurements from drawing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Build 71 run')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded Build 71 patch
        run: python3 .github/scripts/build71_separate_site_measure.py
      - name: Check Studio inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Studio.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/studio-inline.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          PY
          node --check /tmp/studio-inline.js
      - name: Commit Build 71
        run: |
          rm -f .github/workflows/build71-separate-site-measure-from-drawing.yml
          git config user.name "FittersIQ Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Studio.html .github/workflows/build71-separate-site-measure-from-drawing.yml
          git commit -m "Build 71: keep Site Measurements out of Drawing"
          git push origin main
